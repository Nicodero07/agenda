<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="theme-color" content="#0C0C0F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sfondo:#0C0C0F; --card:#17171C; --card2:#1E1E24; --bordo:#2E2E36; --barra:#121216;
  --blu:#2F4BFF; --bluScuro:#1B2FC2; --bluTesto:#8C9BFF; --bluChiaro:#B3BDFF;
  --testo:#F5F5F7; --sec:#A1A1AA; --lavoro:#C9D0FF; --pers:#8A8A94;
  --top:env(safe-area-inset-top); --bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--sfondo);color:var(--testo);font-family:Urbanist,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(120% 420px at 50% -60px,rgba(47,75,255,.38),rgba(47,75,255,0) 70%),var(--sfondo);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--bluTesto)}
main{padding:calc(var(--top) + 16px) 22px calc(var(--bottom) + 100px);max-width:560px;margin:0 auto}
.vista{display:none;flex-direction:column;gap:24px}
.vista.attiva{display:flex}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.3px}
h2{margin:0;font-size:20px;font-weight:700}
.sec{color:var(--sec)}
.riga{display:flex;align-items:center;gap:12px}
.spazio{flex:1}
.card{background:var(--card);border-radius:18px}
.sfumata{background:radial-gradient(140% 160% at 100% 100%,var(--blu) 0%,rgba(47,75,255,.35) 38%,rgba(23,23,28,0) 72%),var(--card);border:1px solid rgba(255,255,255,.06);border-radius:22px}
.sfumata.alto{background:radial-gradient(130% 150% at 100% 0%,var(--blu) 0%,rgba(47,75,255,.3) 40%,rgba(23,23,28,0) 75%),var(--card)}
.tondo{width:44px;height:44px;border-radius:22px;border:none;background:var(--blu);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.quadro{width:44px;height:44px;border-radius:12px;border:1px solid var(--bordo);background:var(--card);color:var(--testo);display:flex;align-items:center;justify-content:center}
svg{flex-shrink:0}
/* Home */
.prossimo{padding:20px;display:flex;flex-direction:column;gap:10px}
.etichetta{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--bluChiaro)}
.grande{font-size:22px;font-weight:800}
.pill{padding:8px 14px;border-radius:999px;background:#fff;color:var(--bluScuro);font-size:14px;font-weight:700}
.compatta{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:var(--card)}
.compatta .ora{width:46px;font-size:15px;font-weight:700;color:var(--sec);font-variant-numeric:tabular-nums}
.barretta{width:4px;height:28px;border-radius:2px}
.compatta .tit{flex:1;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compatta .tipo{font-size:13px;font-weight:600;color:var(--sec)}
.passato{opacity:.55}
.tessere{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tessera{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;background:var(--card);border:1px solid rgba(255,255,255,.06);text-align:left;color:var(--testo)}
.tessera .ico{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.tessera b{font-size:16px}
.tessera span{font-size:13px;color:var(--sec)}
/* Settimana */
.testata{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.freccia{display:flex;align-items:center;gap:4px;min-height:44px;border:none;background:none;padding:0;font-size:13px;font-weight:600;color:var(--sec)}
.giorni{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.giorno{display:flex;flex-direction:column;align-items:center;gap:8px;border:none;background:none;padding:0;color:var(--testo)}
.giorno small{font-size:13px;font-weight:600;color:var(--sec)}
.giorno .num{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.giorno.scelto .num{background:var(--blu)}
.giorno .pt{width:6px;height:6px;border-radius:3px}
.blocco{display:flex;gap:12px;align-items:flex-start;width:100%;border:none;background:none;padding:0;text-align:left;color:var(--testo)}
.blocco .ora{width:44px;padding-top:14px;font-size:13px;font-weight:600;color:var(--sec);flex-shrink:0}
.blocco .corpo{flex:1;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:16px;background:var(--card)}
.blocco .corpo b{font-size:16px}
.blocco .corpo .info{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--sec)}
.blocco.corso .corpo{background:var(--blu);color:#fff}
.blocco.corso .info{color:#E1E6FF}
.blocco.lavoro:not(.corso) .corpo{border:1px dashed #3A3A46}
.adesso{display:flex;align-items:center;gap:8px}
.adesso span{width:44px;font-size:13px;font-weight:700;color:var(--bluTesto)}
.adesso i{width:9px;height:9px;border-radius:5px;border:2px solid #6B80FF}
.adesso hr{flex:1;border:none;height:1px;background:#6B80FF;margin:0}
/* Notizie */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:0 22px}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:36px;padding:0 16px;border:none;border-radius:999px;background:var(--card2);color:#D4D4DA;font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--blu);color:#fff;font-weight:700}
.evidenza{display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:20px;min-height:150px;text-decoration:none;color:var(--testo)}
.evidenza .etichetta{color:var(--lavoro);font-size:12px}
.evidenza b{font-size:21px;font-weight:800;line-height:1.25}
.notizia{display:flex;flex-direction:column;gap:5px;padding:13px 16px;border-radius:16px;background:var(--card);text-decoration:none;color:var(--testo)}
.notizia b{font-size:16px;line-height:1.3}
.notizia span{font-size:12px;font-weight:600;color:var(--sec)}
.lista{display:flex;flex-direction:column;gap:8px}
/* Impostazioni */
.voce{padding:14px 16px;border-radius:18px;background:var(--card)}
.voce summary{list-style:none;display:flex;align-items:center;gap:14px;cursor:pointer}
.voce summary::-webkit-details-marker{display:none}
.voce .ico{width:40px;height:40px;border-radius:20px;background:#24242C;color:var(--bluTesto);display:flex;align-items:center;justify-content:center}
.voce .testi{flex:1;display:flex;flex-direction:column;gap:2px}
.voce .testi b{font-size:16px}
.voce .testi span{font-size:13px;color:var(--sec)}
.voce .dentro{display:flex;flex-direction:column;gap:12px;padding-top:14px;font-size:15px}
.voce[open] .giu{transform:rotate(180deg)}
.interr{position:relative;width:51px;height:31px;flex-shrink:0}
.interr input{opacity:0;width:0;height:0;position:absolute}
.interr span{position:absolute;inset:0;border-radius:16px;background:rgba(120,120,128,.32);transition:.2s}
.interr span::after{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;border-radius:14px;background:#fff;transition:.2s}
.interr input:checked+span{background:var(--blu)}
.interr input:checked+span::after{transform:translateX(20px)}
.campo{min-height:44px;border:1px solid var(--bordo);border-radius:12px;padding:0 14px;background:var(--sfondo);color:var(--testo);font-size:16px;outline:none;width:100%}
textarea.campo{padding:10px 14px;min-height:80px;resize:none}
.btn{min-height:56px;border:none;border-radius:18px;background:var(--blu);color:#fff;font-size:17px;font-weight:700;width:100%}
.btn:disabled{opacity:.5}
.btn2{min-height:36px;padding:0 14px;border:none;border-radius:999px;background:#24242C;color:var(--lavoro);font-size:14px;font-weight:700}
/* Barra schede */
nav{position:fixed;left:0;right:0;bottom:0;height:calc(64px + var(--bottom));padding-bottom:var(--bottom);background:var(--barra);border-top:1px solid #222228;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));z-index:5}
nav button{border:none;background:none;color:#8A8A94;display:flex;align-items:center;justify-content:center}
nav button.on{color:#6B80FF}
/* Foglio nuovo impegno */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10}
.foglio{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--sfondo);border-radius:22px 22px 0 0;padding:20px 22px calc(var(--bottom) + 20px);display:none;flex-direction:column;gap:20px;z-index:11;max-width:560px;margin:0 auto}
.aperto .velo{display:block}
.aperto .foglio{display:flex}
.titolo-input{min-height:60px;border:1px solid var(--bordo);border-radius:18px;padding:0 18px;background:var(--card);font-size:20px;font-weight:700;outline:none;width:100%;color:var(--testo)}
.tre{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
.mini{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:18px;background:var(--card)}
.mini label{font-size:13px;color:var(--sec)}
.mini input{border:none;background:none;font-size:16px;font-weight:700;padding:0;width:100%;color:var(--testo);color-scheme:dark}
.vuoto{color:var(--sec)}
</style>
</head>
<body>
<main>
  <!-- HOME -->
  <section id="v-home" class="vista attiva" aria-label="Home"></section>
  <!-- SETTIMANA -->
  <section id="v-settimana" class="vista" aria-label="Settimana"></section>
  <!-- NOTIZIE -->
  <section id="v-notizie" class="vista" aria-label="Notizie"></section>
  <!-- IMPOSTAZIONI -->
  <section id="v-impostazioni" class="vista" aria-label="Impostazioni"></section>
</main>

<nav aria-label="Schede">
  <button data-tab="home" class="on" aria-label="Home"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg></button>
  <button data-tab="settimana" aria-label="Settimana"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
  <button data-tab="notizie" aria-label="Notizie"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5"/></svg></button>
  <button data-tab="impostazioni" aria-label="Impostazioni"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
</nav>

<div class="velo" data-azione="chiudi"></div>
<form class="foglio" id="foglio" autocomplete="off">
  <div class="riga">
    <button type="button" class="quadro" data-azione="chiudi" aria-label="Chiudi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h1 style="font-size:24px">Nuovo impegno</h1>
  </div>
  <input class="titolo-input" id="f-titolo" placeholder="Cosa devi fare?" aria-label="Cosa devi fare?" required>
  <p class="sec" style="margin:-8px 0 0;font-size:14px">Lezioni e radio li inserisce l'app: qui metti i tuoi impegni.</p>
  <div class="tre">
    <div class="mini"><label for="f-data">Giorno</label><input type="date" id="f-data" required></div>
    <div class="mini"><label for="f-inizio">Dalle</label><input type="time" id="f-inizio" required></div>
    <div class="mini"><label for="f-fine">Alle</label><input type="time" id="f-fine" required></div>
  </div>
  <details class="voce">
    <summary><div class="testi"><b style="font-size:15px">Altre opzioni</b><span>luogo, note</span></div>
      <svg class="giu" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A94" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
    <div class="dentro">
      <input class="campo" id="f-luogo" placeholder="Luogo" aria-label="Luogo">
      <textarea class="campo" id="f-note" placeholder="Note" aria-label="Note"></textarea>
    </div>
  </details>
  <button class="btn" type="submit">Aggiungi</button>
</form>

<script>
"use strict";
// ---------- utilità ----------
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const daIso = s => { const [a, m, g] = s.split("-").map(Number); return new Date(a, m - 1, g); };
const piuGiorni = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const lunediDi = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return piuGiorni(x, -((x.getDay() + 6) % 7)); };
const feriale = d => d.getDay() !== 0 && d.getDay() !== 6;
const lunediDaMostrare = () => { const o = new Date(); return feriale(o) ? lunediDi(o) : piuGiorni(lunediDi(o), 7); };
const minuti = hhmm => Number(hhmm.slice(0, 2)) * 60 + Number(hhmm.slice(3, 5));
const oraAdesso = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const hhmm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const it = (d, o) => d.toLocaleDateString("it-IT", o);
const maiuscola = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const leggi = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } };
const scrivi = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
function fa(data) {
  const s = Math.round((Date.now() - data) / 60000);
  if (s < 1) return "adesso";
  if (s < 60) return `${s} min fa`;
  const h = Math.round(s / 60);
  if (h < 24) return h === 1 ? "1 ora fa" : `${h} ore fa`;
  const g = Math.round(h / 24);
  return g === 1 ? "ieri" : `${g} giorni fa`;
}

// ---------- dati ----------
let ORARIO = { lezioni: [], lavoro: [] };
let perGiorno = new Map();
let personali = leggi("agenda.personali", []);
const imp = Object.assign({ nome: "Nicolò", radio: true }, leggi("agenda.impostazioni", {}));

const FONTI_PREDEFINITE = [
  { nome: "Sport – prima pagina", categoria: "Sport e motori", url: "https://news.google.com/rss/headlines/section/topic/SPORTS?hl=it&gl=IT&ceid=IT:it" },
  { nome: "MotoGP e Superbike", categoria: "Sport e motori", cerca: "MotoGP OR Superbike" },
  { nome: "Formula 1", categoria: "Sport e motori", cerca: '"Formula 1"' },
  { nome: "Monza e Brianza", categoria: "Locali", cerca: "Monza Brianza" },
  { nome: "Muggiò", categoria: "Locali", cerca: "Muggiò", giorni: 3 },
  { nome: "Milano", categoria: "Locali", cerca: "Milano" },
].map(f => ({ attiva: true, ...f, url: f.url || `https://news.google.com/rss/search?q=${encodeURIComponent(f.cerca + " when:" + (f.giorni || 1) + "d")}&hl=it&gl=IT&ceid=IT:it` }));
let fonti = leggi("agenda.fonti", FONTI_PREDEFINITE);
let notizie = (leggi("agenda.notizie", { items: [] }).items || []);
let notizieTs = leggi("agenda.notizie", { ts: 0 }).ts || 0;
let caricoNotizie = false;

function indicizza() {
  perGiorno = new Map();
  const metti = (data, e) => { if (!perGiorno.has(data)) perGiorno.set(data, []); perGiorno.get(data).push(e); };
  for (const l of ORARIO.lezioni) metti(l.data, { tipo: "uni", titolo: l.titolo, inizio: l.inizio, fine: l.fine, luogo: l.aula });
  if (imp.radio) for (const t of ORARIO.lavoro) metti(t.data, { tipo: "lavoro", titolo: "Radio", inizio: t.inizio, fine: t.fine, luogo: "" });
  for (const p of personali) metti(p.data, { tipo: "personale", ...p });
  for (const v of perGiorno.values()) v.sort((a, b) => a.inizio.localeCompare(b.inizio));
}
const impegniDel = d => perGiorno.get(typeof d === "string" ? d : iso(d)) || [];
const COLORE = { uni: "var(--blu)", lavoro: "var(--lavoro)", personale: "var(--pers)" };
const ETICHETTA = { uni: "Uni", lavoro: "Radio", personale: "Personale" };

// ---------- stato ----------
const stato = { tab: "home", lunedi: lunediDaMostrare(), giorno: null, categoria: null };
stato.giorno = feriale(new Date()) ? iso(new Date()) : iso(stato.lunedi);

// ---------- icone ----------
const IC = {
  piu: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  news: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5"/></svg>',
  radio: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8l9-4"/><circle cx="15" cy="14" r="2.5"/><path d="M6.5 12.5h3M6.5 15.5h3"/></svg>',
  sx: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  dx: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  giu: '<svg class="giu" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A94" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
  sole: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  cap: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>',
  pers: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
};

// ---------- HOME ----------
function prossimo(lista) {
  const adesso = oraAdesso();
  return lista.find(e => minuti(e.fine) > adesso);
}
function etichettaProssimo(e) {
  const adesso = oraAdesso(), i = minuti(e.inizio);
  if (i <= adesso) return `Adesso · fino alle ${e.fine}`;
  const m = i - adesso;
  if (m < 60) return `Prossimo · tra ${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  return `Prossimo · tra ${h} h${r ? " " + r + " min" : ""}`;
}
function vistaHome() {
  const oggi = impegniDel(new Date());
  const p = prossimo(oggi);
  const adesso = oraAdesso();
  const recenti = notizie.filter(n => n.data > Date.now() - 12 * 3600e3).length;
  const radio = stato.lunediHome = lunediDaMostrare();
  const giorniRadio = [0, 1, 2, 3, 4].map(i => piuGiorni(radio, i)).filter(g => impegniDel(g).some(e => e.tipo === "lavoro"))
    .map(g => maiuscola(it(g, { weekday: "short" }).replace(".", "")));
  return `
  <div class="riga" style="align-items:flex-start">
    <div style="flex:1;display:flex;flex-direction:column;gap:4px">
      <h1>Ciao ${esc(imp.nome)}</h1>
      <span class="sec" style="font-size:15px;font-weight:500">${maiuscola(it(new Date(), { weekday: "long", day: "numeric", month: "long" }))} · ${oggi.length === 1 ? "1 impegno" : oggi.length + " impegni"}</span>
    </div>
    <button class="tondo" data-azione="nuovo" aria-label="Nuovo impegno">${IC.piu}</button>
  </div>
  ${p ? `
  <div class="sfumata prossimo">
    <span class="etichetta">${esc(etichettaProssimo(p))}</span>
    <span class="grande">${esc(p.titolo)}</span>
    <div class="riga"><span style="font-size:15px;color:#D4D4DA" class="spazio">${p.inizio} – ${p.fine}</span>${p.luogo ? `<span class="pill">${esc(p.luogo)}</span>` : ""}</div>
  </div>` : `
  <div class="sfumata prossimo"><span class="grande" style="font-size:18px">${oggi.length ? "Per oggi hai finito" : "Oggi sei libero 🎉"}</span></div>`}
  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="riga"><h2 class="spazio">Oggi</h2><button class="freccia" style="color:var(--bluTesto);font-size:15px" data-tab="settimana">Settimana</button></div>
    ${oggi.length ? oggi.map(e => `
      <div class="compatta ${minuti(e.fine) <= adesso ? "passato" : ""}">
        <span class="ora">${e.inizio}</span>
        <span class="barretta" style="background:${COLORE[e.tipo]}"></span>
        <span class="tit">${esc(e.titolo)}</span>
        <span class="tipo">${ETICHETTA[e.tipo]}</span>
      </div>`).join("") : `<span class="vuoto">Nessun impegno</span>`}
  </div>
  <div class="tessere">
    <button class="tessera" data-tab="notizie">
      <span class="ico" style="background:var(--blu);color:#fff">${IC.news}</span>
      <b>Notizie</b><span>${notizie.length ? recenti + " nuove" : "Tocca per leggerle"}</span>
    </button>
    <div class="tessera">
      <span class="ico" style="background:#2A2A33;color:var(--lavoro)">${IC.radio}</span>
      <b>Radio</b><span>${giorniRadio.length ? giorniRadio.join(" · ") : "Nessun turno"}</span>
    </div>
  </div>`;
}

// ---------- SETTIMANA ----------
function intervallo(l, breve) {
  const v = piuGiorni(l, 4);
  return `${l.getDate()} – ${breve ? v.getDate() : it(v, { day: "numeric", month: "long" })}`;
}
function vistaSettimana() {
  const l = stato.lunedi;
  const giorni = [0, 1, 2, 3, 4].map(i => piuGiorni(l, i));
  const lista = impegniDel(stato.giorno);
  const eOggi = stato.giorno === iso(new Date());
  const adesso = oraAdesso();
  let idx = eOggi ? lista.findIndex(e => minuti(e.fine) > adesso) : -2;
  if (eOggi && idx === -1) idx = lista.length;
  const linea = `<div class="adesso"><span>${hhmm(adesso)}</span><i></i><hr></div>`;
  const blocchi = lista.map((e, i) => {
    const corso = eOggi && minuti(e.inizio) <= adesso && minuti(e.fine) > adesso;
    const finito = eOggi && minuti(e.fine) <= adesso || daIso(stato.giorno) < daIso(iso(new Date()));
    const sotto = corso ? "In corso" + (e.luogo ? " · " + e.luogo : "") : e.tipo === "lavoro" ? "Aggiunto in automatico" : (e.luogo || "");
    return (i === idx ? linea : "") + `
      <button class="blocco ${e.tipo} ${corso ? "corso" : ""} ${finito && !corso ? "passato" : ""}" ${e.tipo === "personale" ? `data-azione="elimina" data-id="${esc(e.id)}"` : "tabindex=-1"}>
        <span class="ora">${e.inizio}</span>
        <span class="corpo"><b>${esc(e.titolo)}</b><span class="info"><span>${esc(sotto)}</span><span>${e.inizio} – ${e.fine}</span></span></span>
      </button>`;
  }).join("") + (idx === lista.length && lista.length ? linea : "");
  return `
  <div class="testata">
    <button class="freccia" data-azione="settimana" data-delta="-1" aria-label="Settimana precedente">${IC.sx}${intervallo(piuGiorni(l, -7), true)}</button>
    <h1 style="font-size:19px">${intervallo(l, false)}</h1>
    <button class="freccia" data-azione="settimana" data-delta="1" aria-label="Settimana successiva">${intervallo(piuGiorni(l, 7), true)}${IC.dx}</button>
  </div>
  <div class="giorni">
    ${giorni.map(g => `
      <button class="giorno ${iso(g) === stato.giorno ? "scelto" : ""}" data-azione="giorno" data-giorno="${iso(g)}">
        <small>${maiuscola(it(g, { weekday: "short" }).replace(".", ""))}</small>
        <span class="num">${g.getDate()}</span>
        <span class="pt" style="background:${impegniDel(g).length ? "#6B80FF" : "transparent"}"></span>
      </button>`).join("")}
  </div>
  <div style="display:flex;flex-direction:column;gap:14px">
    <h1 style="font-size:22px">${maiuscola(it(daIso(stato.giorno), { weekday: "long" }))}</h1>
    ${lista.length ? blocchi : `<span class="vuoto">Nessun impegno</span>`}
    ${lista.some(e => e.tipo === "personale") ? `<span class="sec" style="font-size:13px">Tocca un tuo impegno per eliminarlo.</span>` : ""}
  </div>`;
}

// ---------- NOTIZIE ----------
function vistaNotizie() {
  const categorie = [...new Set(fonti.filter(f => f.attiva).map(f => f.categoria))];
  const elenco = notizie.filter(n => !stato.categoria || n.categoria === stato.categoria);
  const [prima, ...altre] = elenco;
  return `
  <div style="display:flex;flex-direction:column;gap:4px">
    <h1>Notizie</h1>
    <span class="sec" style="font-size:14px">${caricoNotizie ? "Aggiorno…" : notizieTs ? "Aggiornate " + fa(notizieTs) : ""}</span>
  </div>
  <div class="chips">
    <button class="chip ${!stato.categoria ? "on" : ""}" data-azione="cat" data-cat="">Tutte</button>
    ${categorie.map(c => `<button class="chip ${stato.categoria === c ? "on" : ""}" data-azione="cat" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}
  </div>
  ${prima ? `
  <a class="sfumata alto evidenza" href="${esc(prima.link)}" target="_blank" rel="noopener">
    <span class="etichetta">${esc(prima.categoria)} · ${fa(prima.data)}</span>
    <b>${esc(prima.titolo)}</b>
    <span style="font-size:13px;color:#C4C4CC">${esc(prima.testata)}</span>
  </a>
  <div class="lista">
    ${altre.slice(0, 40).map(n => `
      <a class="notizia" href="${esc(n.link)}" target="_blank" rel="noopener">
        <b>${esc(n.titolo)}</b>
        <span>${esc([n.categoria, n.testata, fa(n.data)].filter(Boolean).join(" · "))}</span>
      </a>`).join("")}
  </div>` : `<span class="vuoto">${caricoNotizie ? "Carico le notizie…" : "Nessuna notizia. "}</span>
  ${caricoNotizie ? "" : `<button class="btn" data-azione="aggiorna-notizie">Riprova</button>`}`}
  ${prima ? `<button class="btn2" style="align-self:flex-start" data-azione="aggiorna-notizie">Aggiorna</button>` : ""}`;
}

async function scaricaFonte(f) {
  const pulisci = (titolo, testata) => {
    const i = titolo.lastIndexOf(" - ");
    if (i > 0 && (!testata || titolo.slice(i + 3) === testata)) return [titolo.slice(0, i), titolo.slice(i + 3)];
    return [titolo, testata || f.nome];
  };
  // 1) servizio rss2json  2) proxy allorigins: servono perché Safari non può leggere i feed direttamente
  try {
    const r = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(f.url));
    const j = await r.json();
    if (j.status === "ok") return j.items.map(x => {
      const [titolo, testata] = pulisci(x.title || "", x.author || "");
      return { titolo, testata, link: x.link, data: Date.parse((x.pubDate || "").replace(" ", "T") + "Z") || Date.now(), categoria: f.categoria };
    });
  } catch (e) {}
  try {
    const r = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(f.url));
    const xml = new DOMParser().parseFromString(await r.text(), "text/xml");
    const t = (el, tag) => (el.getElementsByTagName(tag)[0]?.textContent || "").trim();
    return [...xml.getElementsByTagName("item")].map(it => {
      const [titolo, testata] = pulisci(t(it, "title"), t(it, "source"));
      return { titolo, testata, link: t(it, "link"), data: Date.parse(t(it, "pubDate")) || Date.now(), categoria: f.categoria };
    });
  } catch (e) {}
  return [];
}
async function aggiornaNotizie(forza) {
  if (caricoNotizie) return;
  if (!forza && notizie.length && Date.now() - notizieTs < 20 * 60e3) return;
  caricoNotizie = true; disegna();
  const risultati = await Promise.all(fonti.filter(f => f.attiva).map(scaricaFonte));
  const visti = new Set(), limite = Date.now() - 48 * 3600e3;
  const tutte = risultati.flat().filter(n => n.titolo && n.data > limite)
    .sort((a, b) => b.data - a.data)
    .filter(n => { const k = n.titolo.toLowerCase(); if (visti.has(k)) return false; visti.add(k); return true; });
  if (tutte.length) { notizie = tutte; notizieTs = Date.now(); scrivi("agenda.notizie", { ts: notizieTs, items: notizie.slice(0, 120) }); }
  caricoNotizie = false; disegna();
}

// ---------- IMPOSTAZIONI ----------
function vistaImpostazioni() {
  const attive = fonti.filter(f => f.attiva).length;
  return `
  <h1>Impostazioni</h1>
  <details class="voce">
    <summary><span class="ico">${IC.pers}</span><span class="testi"><b>Il tuo nome</b><span>${esc(imp.nome)}</span></span>${IC.giu}</summary>
    <div class="dentro"><input class="campo" data-imposta="nome" value="${esc(imp.nome)}" aria-label="Nome"></div>
  </details>
  <div class="voce riga">
    <span class="ico">${IC.cap}</span>
    <span class="testi"><b>Orario università</b><span>ITS 34 Filmmaking · ${ORARIO.lezioni.length} lezioni in presenza</span></span>
  </div>
  <div class="voce riga">
    <span class="ico">${IC.radio}</span>
    <span class="testi"><b>Radio</b><span>15:30 – 18:30 quando finisci alle 13:00</span></span>
    <label class="interr"><input type="checkbox" data-imposta="radio" ${imp.radio ? "checked" : ""} aria-label="Mostra i turni in radio"><span></span></label>
  </div>
  <details class="voce">
    <summary><span class="ico">${IC.news}</span><span class="testi"><b>Notizie</b><span>${attive} fonti attive</span></span>${IC.giu}</summary>
    <div class="dentro">
      ${fonti.map((f, i) => `
        <div class="riga"><span class="testi spazio" style="display:flex;flex-direction:column"><span style="color:var(--testo);font-size:15px">${esc(f.nome)}</span><span class="sec" style="font-size:12px">${esc(f.categoria)}</span></span>
        <label class="interr"><input type="checkbox" data-fonte="${i}" ${f.attiva ? "checked" : ""} aria-label="${esc(f.nome)}"><span></span></label></div>`).join("")}
      <div class="riga"><input class="campo" id="nuova-fonte" placeholder="Aggiungi parola (es. Ducati)" aria-label="Nuova parola da cercare"><button class="btn2" data-azione="aggiungi-fonte">Aggiungi</button></div>
      <button class="btn2" style="align-self:flex-start" data-azione="ripristina-fonti">Ripristina predefinite</button>
    </div>
  </details>
  <details class="voce">
    <summary><span class="ico">${IC.sole}</span><span class="testi"><b>Buongiorno</b><span>Apri l'Agenda da sola ogni mattina</span></span>${IC.giu}</summary>
    <div class="dentro" style="color:#D4D4DA;line-height:1.5">
      <span>Con l'app <b>Comandi</b>: Automazione → <b>+</b> → <b>Sveglia</b> → <b>Quando viene fermata</b> (oppure <b>Ora del giorno</b>, lun–ven) → <b>Esegui subito</b> → azione <b>Apri URL</b> e incolla il link dell'Agenda. Si apre in Safari con notizie e impegni del giorno.</span>
    </div>
  </details>`;
}

// ---------- disegno e navigazione ----------
const VISTE = { home: vistaHome, settimana: vistaSettimana, notizie: vistaNotizie, impostazioni: vistaImpostazioni };
function disegna() {
  const v = document.getElementById("v-" + stato.tab);
  // non ridisegnare mentre si scrive in un campo delle impostazioni
  if (stato.tab === "impostazioni" && v.contains(document.activeElement) && document.activeElement.tagName === "INPUT" && document.activeElement.type !== "checkbox") return;
  const aperti = [...v.querySelectorAll("details")].map(d => d.open);
  v.innerHTML = VISTE[stato.tab]();
  v.querySelectorAll("details").forEach((d, i) => { if (aperti[i]) d.open = true; });
}
function vai(tab) {
  stato.tab = tab;
  document.querySelectorAll(".vista").forEach(s => s.classList.toggle("attiva", s.id === "v-" + tab));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  disegna();
  window.scrollTo(0, 0);
  if (tab === "notizie") aggiornaNotizie(false);
}
function cambiaSettimana(delta) {
  stato.lunedi = piuGiorni(stato.lunedi, 7 * delta);
  stato.giorno = iso(stato.lunedi);
  disegna();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-azione]");
  if (!t) return;
  if (t.dataset.tab) return vai(t.dataset.tab);
  const a = t.dataset.azione;
  if (a === "nuovo") apriFoglio();
  else if (a === "chiudi") chiudiFoglio();
  else if (a === "settimana") cambiaSettimana(Number(t.dataset.delta));
  else if (a === "giorno") { stato.giorno = t.dataset.giorno; disegna(); }
  else if (a === "cat") { stato.categoria = t.dataset.cat || null; disegna(); }
  else if (a === "aggiorna-notizie") aggiornaNotizie(true);
  else if (a === "elimina") {
    const p = personali.find(x => x.id === t.dataset.id);
    if (p && confirm(`Eliminare "${p.titolo}"?`)) {
      personali = personali.filter(x => x.id !== p.id); scrivi("agenda.personali", personali); indicizza(); disegna();
    }
  }
  else if (a === "aggiungi-fonte") {
    const campo = document.getElementById("nuova-fonte"), parola = campo.value.trim();
    if (!parola) return;
    fonti.push({ nome: parola, categoria: "Altro", attiva: true, url: `https://news.google.com/rss/search?q=${encodeURIComponent(parola + " when:1d")}&hl=it&gl=IT&ceid=IT:it` });
    scrivi("agenda.fonti", fonti); campo.value = ""; disegna(); aggiornaNotizie(true);
  }
  else if (a === "ripristina-fonti") { fonti = FONTI_PREDEFINITE.map(f => ({ ...f })); scrivi("agenda.fonti", fonti); disegna(); aggiornaNotizie(true); }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.imposta === "radio") { imp.radio = t.checked; scrivi("agenda.impostazioni", imp); indicizza(); }
  if (t.dataset.imposta === "nome") { imp.nome = t.value.trim() || "Nicolò"; scrivi("agenda.impostazioni", imp); }
  if (t.dataset.fonte !== undefined) { fonti[Number(t.dataset.fonte)].attiva = t.checked; scrivi("agenda.fonti", fonti); aggiornaNotizie(true); }
});

// scorrere di lato per cambiare settimana
let tocco = null;
document.getElementById("v-settimana").addEventListener("touchstart", e => { tocco = [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
document.getElementById("v-settimana").addEventListener("touchend", e => {
  if (!tocco) return;
  const dx = e.changedTouches[0].clientX - tocco[0], dy = e.changedTouches[0].clientY - tocco[1];
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) cambiaSettimana(dx < 0 ? 1 : -1);
  tocco = null;
});

// ---------- foglio "Nuovo impegno" ----------
const foglio = document.getElementById("foglio");
function apriFoglio() {
  const ora = new Date(); ora.setHours(ora.getHours() + 1, 0, 0, 0);
  document.getElementById("f-data").value = iso(ora);
  document.getElementById("f-inizio").value = hhmm(ora.getHours() * 60);
  document.getElementById("f-fine").value = hhmm(Math.min(ora.getHours() * 60 + 60, 23 * 60 + 59));
  ["f-titolo", "f-luogo", "f-note"].forEach(id => document.getElementById(id).value = "");
  document.body.classList.add("aperto");
  setTimeout(() => document.getElementById("f-titolo").focus(), 50);
}
function chiudiFoglio() { document.body.classList.remove("aperto"); }
document.getElementById("f-inizio").addEventListener("change", e => {
  const fine = document.getElementById("f-fine");
  if (fine.value <= e.target.value) fine.value = hhmm(Math.min(minuti(e.target.value) + 60, 23 * 60 + 59));
});
foglio.addEventListener("submit", e => {
  e.preventDefault();
  const v = id => document.getElementById(id).value.trim();
  if (!v("f-titolo") || !v("f-data") || !v("f-inizio")) return;
  personali.push({ id: String(Date.now()), titolo: v("f-titolo"), data: v("f-data"), inizio: v("f-inizio"), fine: v("f-fine") > v("f-inizio") ? v("f-fine") : hhmm(Math.min(minuti(v("f-inizio")) + 60, 23 * 60 + 59)), luogo: v("f-luogo"), note: v("f-note") });
  scrivi("agenda.personali", personali);
  indicizza(); chiudiFoglio(); disegna();
});

// ---------- avvio ----------
async function avvia() {
  try { ORARIO = await (await fetch("orario.json", { cache: "no-cache" })).json(); } catch (e) {}
  indicizza();
  const h = location.hash.slice(1);
  if (VISTE[h]) vai(h); else disegna();
  aggiornaNotizie(false);
  setInterval(() => { if (!document.hidden && !document.body.classList.contains("aperto")) disegna(); }, 60e3);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { disegna(); aggiornaNotizie(false); } });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
avvia();
</script>
